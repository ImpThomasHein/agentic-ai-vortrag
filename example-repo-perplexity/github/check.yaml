name: Agentic-Checks

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: mheap/require-checklist-action@v2 # oder ein ähnliches Checklist-Action
        with:
          requireChecklist: true # PR muss eine vollständige Checkliste haben

  ticket-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfe Ticket-Key im PR-Titel
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          if ! echo "$TITLE" | grep -Eq "PY-[0-9]+"; then
            echo "Kein Ticket-Key (PY-1234) im PR-Titel gefunden."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Tests ausführen
        run: |
          make test   # an euer Projekt anpassen
      - name: Lint/Clean-Code-Checks
        run: |
          make lint   # z. B. flake8/black/mypy etc.
